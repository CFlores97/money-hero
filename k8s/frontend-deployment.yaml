apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneyhero-frontend
  namespace: moneyhero
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moneyhero-frontend
  template:
    metadata:
      labels:
        app: moneyhero-frontend
    spec:
      containers:
        - name: frontend
          image: joedsosa/moneyhero-frontend:1.3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:30082"