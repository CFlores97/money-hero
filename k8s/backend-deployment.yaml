apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneyhero-backend
  namespace: moneyhero
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moneyhero-backend
  template:
    metadata:
      labels:
        app: moneyhero-backend
    spec:
      containers:
        - name: backend
          image: money-hero-backend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "development"
            - name: FRONTEND_URL
              value: "http://localhost:30083"
            - name: JWT_EXPIRES_IN
              value: "1d"
            - name: BUDGET_ALERT_PERCENTAGE
              value: "80"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moneyhero-backend-secret
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: moneyhero-backend-secret
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: moneyhero-backend-secret
                  key: JWT_SECRET